[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wagtail-generate"
version = "0.1.0"
description = "Generate opinionated Wagtail CMS projects from reusable codebase layouts."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [
  { name = "Nick Moreton" },
]
dependencies = [
  "jinja2>=3.1",
]

[project.scripts]
wagtail-generate = "wagtail_generate.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.17",
  "pre-commit>=4.6.2",
  "pytest>=8.4",
  "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wagtail_generate"]
artifacts = ["src/wagtail_generate/templates/**"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["wagtail_generate"]
