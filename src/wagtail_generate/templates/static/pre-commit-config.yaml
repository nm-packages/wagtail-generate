repos:
  - repo: local
    hooks:
      - id: uv-lock
        name: Validate UV lockfile
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false

      - id: ruff-check
        name: Ruff lint
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: Ruff format
        entry: uv run ruff format
        language: system
        types: [python]

      - id: djangofmt
        name: Format Django templates
        entry: uv run djangofmt
        language: system
        files: (^|/)templates/.*\.html$
